# CI Pipeline — lint, test, build for all Go code and infra assets
name: CI

on:
  push:
    branches: [main, feature/*]
    paths:
      - 'apps/go-api/**'
      - 'apps/echo-server/**'
      - 'cmd/labctl/**'
      - 'engine/**'
      - 'platform/**'
      - 'runtimes/**'
      - 'services/**'
      - 'bootstrap/**'
      - 'scenarios/**'
      - 'incidents/**'
      - 'learn/**'
      - 'challenges/**'
      - 'foundation/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/go-api/**'
      - 'apps/echo-server/**'
      - 'cmd/labctl/**'
      - 'engine/**'
      - 'platform/**'
      - 'runtimes/**'
      - 'services/**'
      - 'bootstrap/**'
      - 'scenarios/**'
      - 'incidents/**'
      - 'learn/**'
      - 'challenges/**'
      - 'foundation/terraform/**'

env:
  GO_VERSION: '1.24'
  TERRAFORM_VERSION: '1.7.0'

jobs:
  lint-apps:
    name: Lint apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go vet
        working-directory: apps/${{ matrix.app }}
        run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: apps/${{ matrix.app }}

  lint-cli:
    name: Lint CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        working-directory: cmd/labctl
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Go vet
        working-directory: cmd/labctl
        run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          working-directory: cmd/labctl

  lint-shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          find engine platform runtimes services bootstrap incidents scenarios learn challenges -name '*.sh' \
            -exec shellcheck --severity=warning {} +
      - name: Portability check (no GNU-only constructs)
        run: |
          if grep -rnE 'grep -oP|sed -i |readlink -f|date -d|stat -c' \
               --include='*.sh' engine platform runtimes services bootstrap incidents scenarios learn challenges; then
            echo "::error::GNU-only shell constructs found — fix before merging"
            exit 1
          fi

  lint-terraform:
    name: Terraform lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform format check
        run: terraform fmt -check -recursive foundation/terraform
      - name: Terraform validate (modules)
        run: |
          for dir in foundation/terraform/modules/*/; do
            echo "==> validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false -upgrade
            terraform -chdir="$dir" validate
          done

  lint-yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --quiet yamllint
      - name: Lint scenario and platform YAML
        run: yamllint -d relaxed scenarios/ platform/ learn/ challenges/

  test-apps:
    name: Test apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: apps/${{ matrix.app }}/coverage.out

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        working-directory: cmd/labctl
        run: go test -v -race ./internal/...
      - name: Build CLI
        run: |
          cp -r ui/dist/* cmd/labctl/ui/dist/
          cd cmd/labctl && go build -o /dev/null .

  build-images:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint-apps, test-apps]
    strategy:
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: apps/${{ matrix.app }}
        run: |
          docker build -t ${{ matrix.app }}:${{ github.sha }} .
          docker tag ${{ matrix.app }}:${{ github.sha }} ${{ matrix.app }}:latest
      - name: Export image for scanning
        run: docker save ${{ matrix.app }}:${{ github.sha }} > ${{ matrix.app }}.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: ${{ matrix.app }}.tar
          retention-days: 1
      - name: Verify image
        run: docker images ${{ matrix.app }}

  image-scan:
    name: Image scan
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      security-events: write
    strategy:
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.app }}
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          input: ${{ matrix.app }}.tar
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  helm-lint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [go-api, echo-server]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint apps/${{ matrix.app }}/deploy/helm -f apps/${{ matrix.app }}/deploy/helm/values-dev.yaml
      - name: Template validation
        run: |
          helm template ${{ matrix.app }} apps/${{ matrix.app }}/deploy/helm \
            -f apps/${{ matrix.app }}/deploy/helm/values-dev.yaml \
            --namespace ${{ matrix.app }}
