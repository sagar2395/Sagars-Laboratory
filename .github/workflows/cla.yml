name: CLA

# Contributor License Agreement gate (CLA Assistant Lite).
#
# MAINTAINER SETUP (manual action B2):
#   1. Create a repo (or use this one) to store signatures, e.g.
#      snowops/cla-signatures with a signatures/ dir.
#   2. Add a Personal Access Token secret `CLA_SIGNATURES_TOKEN` with write
#      access to the signatures repo (or use a fine-grained token).
#   3. (Optional) tune the allowlist for bots.
# Until configured, this workflow no-ops on a missing token.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Skip cleanly until the maintainer wires the signatures token (B2).
    if: ${{ vars.CLA_ENABLED == 'true' }}
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/snowops/flightdeck/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✍️'
