apiVersion: scenario.flightdeck.dev/v2
name: hello-flightdeck
displayName: "Hello, Flightdeck"
description: "The smallest possible v2 scenario: one stage, one check. Use it as a template for your own pack scenarios."
category: tutorial
prerequisites:
  apps:
    - go-api
runtimes:
  - k3d
  - aks
  - eks

objectives:
  - "Confirm the go-api app is reachable — the simplest verifiable goal"

stages:
  - name: smoke
    description: A no-op marker stage (scenarios may also be check-only)
    components:
      - name: ready
        type: script
        script: scripts/ready.sh

checks:
  - name: go-api-deployment-ready
    type: kubectl
    resource: deployment/go-api
    namespace: go-api
    jsonpath: "{.status.readyReplicas}"
    operator: ">="
    value: "1"

explore:
  commands:
    - label: "Curl the app"
      command: "curl -s http://go-api.{{.DomainSuffix}}/health"
  tips:
    - "This scenario only verifies go-api is up; copy it and add your own stages."
