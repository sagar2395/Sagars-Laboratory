# Example scenario-pack manifest. Copy this as the starting point for your own
# pack. The pack.yaml sits at the pack root, alongside one directory per scenario
# (each containing a scenario.yaml).
apiVersion: packs.flightdeck.dev/v1
kind: ScenarioPack
metadata:
  name: examples/hello-pack
  version: 0.1.0
  publisher: flightdeck
  displayName: "Hello Pack"
  description: "A minimal example pack with one scenario — the reference for authors."
  homepage: https://github.com/snowops/flightdeck
  license: Apache-2.0
  tier: community
  keywords: [example, getting-started]
  categories: [tutorial]
spec:
  engine:
    scenarioApiVersions: ["scenario.flightdeck.dev/v2"]
    minLabctlVersion: "0.1.0"
  requires:
    platform: []
  provides:
    scenarios: [hello-flightdeck]
