---
# Staging environment — namespace, release metadata, go-api deployment + service
apiVersion: v1
kind: Namespace
metadata:
  name: env-staging
  labels:
    flightdeck.dev/env: staging
    flightdeck.dev/scenario: env-promotion
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-metadata
  namespace: env-staging
  labels:
    flightdeck.dev/env: staging
    flightdeck.dev/scenario: env-promotion
data:
  env_name: "staging"
  app: "go-api"
  image_tag: "v1.1.0"
  promoted_from: ""
  promoted_at: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: env-staging
  labels:
    app: go-api
    flightdeck.dev/env: staging
    flightdeck.dev/image-tag: v1.1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api
      flightdeck.dev/env: staging
  template:
    metadata:
      labels:
        app: go-api
        flightdeck.dev/env: staging
    spec:
      containers:
        - name: go-api
          image: go-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ENV_NAME
              value: staging
            - name: IMAGE_TAG
              valueFrom:
                configMapKeyRef:
                  name: env-metadata
                  key: image_tag
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: env-staging
  labels:
    flightdeck.dev/env: staging
spec:
  selector:
    app: go-api
    flightdeck.dev/env: staging
  ports:
    - port: 80
      targetPort: 8080
