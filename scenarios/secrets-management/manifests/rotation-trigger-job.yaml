# Job that rotates the Vault secret and then verifies ESO has synced it.
# Demonstrates the full rotation cycle automatically during scenario activation.
apiVersion: batch/v1
kind: Job
metadata:
  name: secret-rotation-demo
  namespace: go-api
  labels:
    scenario: secrets-management
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rotation-demo
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "=== Secret Rotation Demo ==="
              echo ""
              echo "Before rotation:"
              kubectl get secret go-api-external-secret -n go-api \
                -o jsonpath='{.data.db_password}' 2>/dev/null | base64 -d || echo "(not yet synced)"
              echo ""
              echo "Rotating secret in Vault via exec..."
              kubectl exec -n vault deploy/vault -- \
                vault kv put secret/go-api \
                  db_password=rotated-by-scenario \
                  api_key=rotated-api-key
              echo ""
              echo "Waiting 35 s for ESO to sync (refreshInterval=30s)..."
              sleep 35
              echo ""
              echo "After rotation:"
              NEW_VAL=$(kubectl get secret go-api-external-secret -n go-api \
                -o jsonpath='{.data.db_password}' | base64 -d)
              echo "db_password = ${NEW_VAL}"
              if [ "${NEW_VAL}" = "rotated-by-scenario" ]; then
                echo "SUCCESS: Secret propagated without pod restart."
              else
                echo "WARN: Value not yet updated — check ESO sync events."
              fi
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      serviceAccountName: default
