# Fault injection: add 500 ms fixed latency to 100% of requests routed to the canary.
# This simulates a slow regression in the v2 candidate so you can see the effect
# in Grafana/Kiali before widening the traffic split.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-api-canary
  namespace: go-api
spec:
  hosts:
    - go-api
  http:
    - match:
        - headers:
            end-user:
              exact: canary-tester
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 500ms
      route:
        - destination:
            host: go-api
            subset: canary
    - route:
        - destination:
            host: go-api
            subset: stable
          weight: 90
        - destination:
            host: go-api
            subset: canary
          weight: 10
