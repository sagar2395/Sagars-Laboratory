# Kafka producer: sends 1 message per second to lab-events topic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: kafka
  labels:
    app: kafka-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
    spec:
      containers:
        - name: producer
          image: bitnami/kafka:latest
          command:
            - /bin/bash
            - -c
            - |
              while true; do
                echo "event-$(date +%s)-$$"
                sleep 1
              done | kafka-console-producer.sh \
                --bootstrap-server kafka.kafka.svc.cluster.local:9092 \
                --topic lab-events
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
