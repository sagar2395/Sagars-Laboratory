# Kafka consumer: reads from lab-events as part of lab-consumer-group.
# Start at 1 replica — scale to 0 to build lag, then scale up to drain it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: kafka
  labels:
    app: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: consumer
          image: bitnami/kafka:latest
          command:
            - kafka-console-consumer.sh
            - --bootstrap-server
            - kafka.kafka.svc.cluster.local:9092
            - --topic
            - lab-events
            - --group
            - lab-consumer-group
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
