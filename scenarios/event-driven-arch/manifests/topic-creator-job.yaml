# One-shot Job that creates the lab-events topic.
# Uses the same Bitnami Kafka image already deployed.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-creator
  namespace: kafka
  labels:
    app: kafka-topic-creator
spec:
  template:
    metadata:
      labels:
        app: kafka-topic-creator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topic-creator
          image: bitnami/kafka:latest
          command:
            - kafka-topics.sh
            - --bootstrap-server
            - kafka.kafka.svc.cluster.local:9092
            - --create
            - --if-not-exists
            - --topic
            - lab-events
            - --partitions
            - "3"
            - --replication-factor
            - "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
