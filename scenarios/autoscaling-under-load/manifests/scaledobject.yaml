# KEDA ScaledObject: scales go-api based on Prometheus HTTP request rate.
# Scale-out trigger: > 10 RPS per replica → add replica.
# Min: 1, Max: 10, cooldown: 60 s.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: go-api-rps
  namespace: go-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-api
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        # Prometheus scrapes go-api's /metrics endpoint;
        # http_requests_total is the standard metric from go-api's middleware.
        serverAddress: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        metricName: go_api_rps
        query: |
          sum(rate(http_requests_total{namespace="go-api"}[1m]))
        # Each replica handles up to 10 RPS; KEDA drives targetValue replicas = query / 10.
        threshold: "10"
