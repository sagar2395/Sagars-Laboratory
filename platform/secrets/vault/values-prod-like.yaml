# Non-dev Vault values — production-like starting point.
# Apply with: helm upgrade --install vault hashicorp/vault -f values.yaml -f values-prod-like.yaml
# You MUST configure proper storage (e.g. raft) and seal settings.

server:
  dev:
    enabled: false  # ← disable dev mode

  # Raft storage for HA (requires PVC)
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true

  # Reference your real unseal config here (KMS, Transit, etc.)
  # extraSecretEnvironmentVars:
  #   - envName: VAULT_SEAL_TYPE
  #     secretName: vault-seal-config
  #     secretKey: type

  affinity: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

injector:
  enabled: true

ui:
  enabled: true
