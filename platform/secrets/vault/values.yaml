# HashiCorp Vault values for k3d lab simulator (dev mode).
# Full reference: https://artifacthub.io/packages/helm/hashicorp/vault

server:
  dev:
    # Dev mode: single pod, in-memory, auto-unsealed, root token = "root".
    # NOT for production use.
    enabled: true
    devRootToken: "root"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # Single replica — dev mode is always single-node
  affinity: ""
  tolerations: []

  # Ingress so the UI is accessible at vault.<DOMAIN_SUFFIX>
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: vault.k3d.local
        paths:
          - /

# Disable HA, agent injection, and CSI for minimal footprint
ha:
  enabled: false

injector:
  enabled: false

csi:
  enabled: false

# UI enabled so we can browse secrets in the dashboard
ui:
  enabled: true
